name: P2-C candidate consolidation

on:
  pull_request:
    paths:
      - '.github/workflows/p2c-candidate-consolidation.yml'
      - 'backend/**'
      - 'frontend/**'
      - 'docs/p2c-candidate-consolidation.md'
      - 'docs/p2c-real-evaluation.md'
  push:
    branches: [feature/p2c-candidate-consolidation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y pandoc
          cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Download public regression papers
        run: |
          curl -fsSL https://arxiv.org/pdf/1803.02155 -o "$RUNNER_TEMP/shaw2018.pdf"
          echo '8086e2e5e139fd576631ce0ec4560c5ee66225bec260d631a3e8fe7f1f13d50b  '"$RUNNER_TEMP/shaw2018.pdf" | sha256sum --check
          curl -fsSL https://www.jmlr.org/papers/volume25/24-0404/24-0404.pdf -o "$RUNNER_TEMP/jmlr2024.pdf"
          echo '4ddf0066146f0644ba87d2462e9f73d3d72537d1daffb8d6ccc50840ff6c7dea  '"$RUNNER_TEMP/jmlr2024.pdf" | sha256sum --check
      - name: Backend tests including P2-C, P2-B, P2-A and P1 regressions
        env:
          P11_SHAW_PDF: ${{ runner.temp }}/shaw2018.pdf
          P11_JMLR_PDF: ${{ runner.temp }}/jmlr2024.pdf
        run: python -m pytest backend/tests -q
      - name: Unchanged frontend build
        working-directory: frontend
        run: npm run build
      - name: Existing PDF reader and offline review browser regression
        env:
          PAPER_REVIEW_DATA_DIR: ${{ runner.temp }}/p2c-browser-data
          REAL_PDF_PATH: ${{ runner.temp }}/Self-Attention with Relative Position Representations.pdf
        run: |
          cp "$RUNNER_TEMP/shaw2018.pdf" "$REAL_PDF_PATH"
          python -m uvicorn backend.app:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/p2c-backend.log" 2>&1 &
          backend_pid=$!
          (cd frontend && npm run dev -- --host 127.0.0.1) > "$RUNNER_TEMP/p2c-frontend.log" 2>&1 &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/auth/status > /dev/null &&
               curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          cd frontend
          npx playwright test tests/real-pdf.spec.ts tests/cross-formula.spec.ts tests/review-modes.spec.ts --workers=1
